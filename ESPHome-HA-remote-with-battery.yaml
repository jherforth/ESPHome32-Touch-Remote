esphome:
  name: esphome-web-remote
  friendly_name: Living Room Remote
  min_version: 2025.9.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - delay: 500ms
      - lambda: |-
          auto *bus = id(i2c_bus);
          uint8_t addr = 0x15;
          uint8_t data = 0x00;
          for (int i = 0; i < 10; i++) {
            auto err = bus->write(addr, &data, 1, true);
            if (err == ESP_OK) {
              ESP_LOGI("touch", "CST816D init OK on attempt %d", i + 1);
              break;
            }
            vTaskDelay(pdMS_TO_TICKS(100));
          }
      - lvgl.label.update:
          id: lbl_battery
          text: "BAT --%"
      - lvgl.label.update:
          id: lbl_battery
          text_color: !lambda 'return lv_color_hex(0x808080);'
      - lvgl.label.update:
          id: lbl_battery_icon
          text_color: !lambda 'return lv_color_hex(0x808080);'

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  id: spi2_bus
  clk_pin: 5
  mosi_pin: 4
  miso_pin: 19

i2c:
  sda: 18
  scl: 8
  scan: true
  id: i2c_bus

script:
  - id: wake_display
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - delay: 60s
      - light.turn_on:
          id: backlight
          brightness: 5%
  - id: scene_fans_off
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_off
  - id: scene_fans_medium
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_medium
  - id: scene_fans_high
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_high
  - id: scene_lights_off
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fan_lights_off
  - id: scene_lights_dim
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.dim_fan_lights
  - id: scene_lights_bright
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.bright_fan_lights

output:
  - platform: ledc
    pin:
      number: 15
      inverted: true
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    id: my_display
    spi_id: spi2_bus
    model: ST7789V
    cs_pin: 7
    dc_pin: 6
    reset_pin: 14
    rotation: 180
    dimensions:
      width: 172
      height: 320
      offset_width: 34
      offset_height: 0
    auto_clear_enabled: false
    update_interval: never
    color_order: rgb
    invert_colors: false

touchscreen:
  - platform: cst816
    id: my_touchscreen
    i2c_id: i2c_bus
    display: my_display
    skip_probe: true
    update_interval: 50ms
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true
    on_touch:
      - script.execute: wake_display

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  buffer_size: 10%
  disp_bg_color: 0x000000
  page_wrap: false
  theme:
    button:
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_color: 0x505050
      border_width: 1
      radius: 12
      text_color: 0x000000
      text_font: montserrat_28
      pressed:
        bg_color: 0x006446
        border_color: 0x00B478
  pages:
    - id: main_page
      widgets:
        - obj:
            width: 100%
            height: 100%
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - obj:
                  id: tab_bar
                  align: TOP_MID
                  y: 4
                  width: 164
                  height: 36
                  bg_color: 0xFFFFFF
                  bg_opa: COVER
                  border_width: 1
                  border_color: 0x505050
                  radius: 4
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    pad_column: 0
                  widgets:
                    - obj:
                        id: tab_fans
                        width: 50%
                        height: 100%
                        bg_color: 0xfc69e0
                        bg_opa: COVER
                        border_width: 0
                        radius: 4
                        pad_all: 0
                        on_click:
                          - lvgl.widget.update:
                              id: tab_fans
                              bg_color: 0xfc69e0
                          - lvgl.label.update:
                              id: lbl_tab_fans
                              text_color: 0x000000
                          - lvgl.widget.update:
                              id: tab_lights
                              bg_color: 0xFFFFFF
                          - lvgl.label.update:
                              id: lbl_tab_lights
                              text_color: 0x808080
                          - lvgl.widget.hide:
                              id: content_lights
                          - lvgl.widget.show:
                              id: content_fans
                        widgets:
                          - label:
                              id: lbl_tab_fans
                              align: CENTER
                              text: "Fans"
                              text_color: 0xFFFFFF
                              text_font: montserrat_18
                    - obj:
                        id: tab_lights
                        width: 50%
                        height: 100%
                        bg_color: 0xFFFFFF
                        bg_opa: COVER
                        border_width: 0
                        radius: 4
                        pad_all: 0
                        on_click:
                          - lvgl.widget.update:
                              id: tab_lights
                              bg_color: 0x006446
                          - lvgl.label.update:
                              id: lbl_tab_lights
                              text_color: 0xFFFFFF
                          - lvgl.widget.update:
                              id: tab_fans
                              bg_color: 0xFFFFFF
                          - lvgl.label.update:
                              id: lbl_tab_fans
                              text_color: 0x000000
                          - lvgl.widget.hide:
                              id: content_fans
                          - lvgl.widget.show:
                              id: content_lights
                        widgets:
                          - label:
                              id: lbl_tab_lights
                              align: CENTER
                              text: "Lights"
                              text_color: 0x000000
                              text_font: montserrat_18
              - obj:
                  id: content_fans
                  align: TOP_MID
                  y: 48
                  width: 164
                  height: 232
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    pad_row: 8
                  widgets:
                    - button:
                        width: 100%
                        height: 72
                        id: btn_fans_off
                        on_click:
                          - script.execute: scene_fans_off
                        widgets:
                          - label:
                              align: CENTER
                              text: "Off"
                    - button:
                        width: 100%
                        height: 72
                        id: btn_fans_medium
                        on_click:
                          - script.execute: scene_fans_medium
                        widgets:
                          - label:
                              align: CENTER
                              text: "Medium"
                    - button:
                        width: 100%
                        height: 72
                        id: btn_fans_high
                        on_click:
                          - script.execute: scene_fans_high
                        widgets:
                          - label:
                              align: CENTER
                              text: "High"
              - obj:
                  id: content_lights
                  align: TOP_MID
                  y: 48
                  width: 164
                  height: 232
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  hidden: true
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    pad_row: 8
                  widgets:
                    - button:
                        width: 100%
                        height: 72
                        id: btn_lights_off
                        on_click:
                          - script.execute: scene_lights_off
                        widgets:
                          - label:
                              align: CENTER
                              text: "Off"
                    - button:
                        width: 100%
                        height: 72
                        id: btn_lights_dim
                        on_click:
                          - script.execute: scene_lights_dim
                        widgets:
                          - label:
                              align: CENTER
                              text: "Dim"
                    - button:
                        width: 100%
                        height: 72
                        id: btn_lights_bright
                        on_click:
                          - script.execute: scene_lights_bright
                        widgets:
                          - label:
                              align: CENTER
                              text: "Bright"
  top_layer:
    widgets:
      - label:
          id: lbl_wifi
          align: BOTTOM_LEFT
          x: 4
          y: -2
          text: "WiFi"
          text_font: montserrat_14
          text_color: 0xC80000
      - label:
          id: lbl_api
          align: BOTTOM_RIGHT
          x: -4
          y: -2
          text: "HA"
          text_font: montserrat_14
          text_color: 0xC80000
      - label:
          id: lbl_battery_icon
          align: BOTTOM_MID
          x: -18
          y: -2
          text: "🔋"
          text_font: montserrat_14
      - label:
          id: lbl_battery
          align: BOTTOM_MID
          x: 10
          y: -2
          text: "BAT"
          text_font: montserrat_14

text_sensor:
  - platform: template
    id: api_status
    name: "API Status"
    internal: true
    lambda: |-
      if (api::global_api_server != nullptr && api::global_api_server->is_connected()) {
        return {"Connected"};
      } else {
        return {"Disconnected"};
      }
    update_interval: 5s
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "Connected";'
            then:
              - lvgl.label.update:
                  id: lbl_api
                  text_color: !lambda 'return lv_color_hex(0xfc69e0);'
            else:
              - lvgl.label.update:
                  id: lbl_api
                  text_color: !lambda 'return lv_color_hex(0x20ff0a);'

binary_sensor:
  - platform: status
    id: wifi_connection_status
    internal: true
    on_press:
      - lvgl.label.update:
          id: lbl_wifi
          text_color: !lambda 'return lv_color_hex(0xfc69e0);'
    on_release:
      - lvgl.label.update:
          id: lbl_wifi
          text_color: !lambda 'return lv_color_hex(0x20ff0a);'

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 5s
    internal: true
    on_value:
      then:
        - if:
            condition:
              binary_sensor.is_on: wifi_connection_status
            then:
              - if:
                  condition:
                    lambda: 'return x > -60;'
                  then:
                    - lvgl.label.update:
                        id: lbl_wifi
                        text_color: !lambda 'return lv_color_hex(0xfcc254);'
                  else:
                    - if:
                        condition:
                          lambda: 'return x > -80;'
                        then:
                          - lvgl.label.update:
                              id: lbl_wifi
                              text_color: !lambda 'return lv_color_hex(0xff7024);'
                        else:
                          - lvgl.label.update:
                              id: lbl_wifi
                              text_color: !lambda 'return lv_color_hex(0x20ff0a);'
            else:
              - lvgl.label.update:
                  id: lbl_wifi
                  text_color: !lambda 'return lv_color_hex(0x20ff0a);'

  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 60s
    attenuation: auto
    filters:
      - multiply: 1.8          # keep this — we'll tune it based on logs
    icon: "mdi:battery"
    on_value:
      then:
        - logger.log:
            format: "Battery → raw_state: %.0f    filtered: %.3f V"
            args: [ 'id(battery_voltage).raw_state', 'x' ]

  - platform: template
    name: "Battery Level"
    id: battery_percent
    unit_of_measurement: "%"
    icon: "mdi:battery"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      if (isnan(id(battery_voltage).state)) return {};
      float v = id(battery_voltage).state;

      // Adjusted curve - 4.11 V should give ~90-92%
      if (v >= 4.20) return 100;
      if (v <= 3.40) return 0;
      if (v >= 4.00) return 80 + (v - 4.00) * 100;     // 80-100%
      else if (v >= 3.80) return 40 + (v - 3.80) * 200; // 40-80%
      else if (v >= 3.60) return 10 + (v - 3.60) * 150; // 10-40%
      else return (v - 3.40) * 50;                       // 0-10%

    on_value:
      then:
        # Update text (with "BAT ")
        - lvgl.label.update:
            id: lbl_battery
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%d%%", (int)round(x));
              return std::string(buf);

        # Update text color
        - lvgl.label.update:
            id: lbl_battery
            text_color: !lambda |-
              int pct = (int)round(x);
              if (pct >= 80)      return lv_color_hex(0xfc69e0);  // green     ≥80% 
              else if (pct >= 50) return lv_color_hex(0xfcc254);  // yellow    50–79%
              else if (pct >= 20) return lv_color_hex(0xff7024);  // orange    20–49%
              else                return lv_color_hex(0x20ff0a);  // red/pink  <20%

        # Update icon color (same logic)
        - lvgl.label.update:
            id: lbl_battery_icon
            text_color: !lambda |-
              int pct = (int)round(x);
              if (pct >= 80)      return lv_color_hex(0xfc69e0);
              else if (pct >= 50) return lv_color_hex(0xfcc254);
              else if (pct >= 20) return lv_color_hex(0xff7024);
              else                return lv_color_hex(0x20ff0a);

        # Debug log – fixed version
        - logger.log:
            format: "Battery update → pct: %d   color: 0x20ff0a (green) or other"
            args: [ '(int)round(x)' ]
