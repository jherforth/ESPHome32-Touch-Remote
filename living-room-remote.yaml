esphome:
  name: esphome-web-remote
  friendly_name: Living Room Remote
  min_version: 2025.9.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - delay: 500ms
      - lambda: |-
          auto *bus = id(i2c_bus);
          uint8_t addr = 0x15;
          uint8_t data = 0x00;
          for (int i = 0; i < 10; i++) {
            auto err = bus->write(addr, &data, 1, true);
            if (err == ESP_OK) {
              ESP_LOGI("touch", "CST816D init OK on attempt %d", i + 1);
              break;
            }
            vTaskDelay(pdMS_TO_TICKS(100));
          }

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: current_page
    type: int
    initial_value: '0'
  - id: pressed_btn
    type: int
    initial_value: '0'
  - id: swipe_start_x
    type: int
    initial_value: '0'
  - id: last_touch_x
    type: int
    initial_value: '0'

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 20
  - file: "gfonts://Roboto"
    id: roboto_large
    size: 28
  - file: "gfonts://Roboto"
    id: roboto_small
    size: 14

spi:
  id: spi2_bus
  clk_pin: 5
  mosi_pin: 4
  miso_pin: 19

i2c:
  sda: 18
  scl: 8
  scan: true
  id: i2c_bus

script:
  - id: scene_fans_off
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_off
  - id: scene_fans_medium
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_medium
  - id: scene_fans_high
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_high
  - id: scene_lights_off
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fan_lights_off
  - id: scene_lights_dim
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.dim_fan_lights
  - id: scene_lights_bright
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.bright_fan_lights
  - id: clear_press_feedback
    mode: restart
    then:
      - delay: 250ms
      - lambda: 'id(pressed_btn) = 0;'

display:
  - platform: st7789v
    spi_id: spi2_bus
    model: Waveshare 1.47in 172X320
    cs_pin: 7
    dc_pin: 6
    reset_pin: 14
    rotation: 180
    backlight_pin:
      number: 15
      inverted: true
    lambda: |-
      it.fill(Color(0, 0, 0));

      int page = id(current_page);
      int pressed = id(pressed_btn);

      int margin = 8;
      int btn_w = 172 - 2 * margin;
      int btn_h = 72;
      int btn_spacing = 8;
      int btn_start_y = 48;

      auto bg_color = Color(30, 30, 30);
      auto pressed_color = Color(0, 100, 70);
      auto border_color = Color(80, 80, 80);
      auto pressed_border = Color(0, 180, 120);
      auto text_color = Color(255, 255, 255);
      auto title_color = Color(180, 180, 180);

      const char* title = page == 0 ? "FANS" : "LIGHTS";
      it.printf(86, 12, id(roboto_large), title_color, TextAlign::TOP_CENTER, "%s", title);

      const char* fan_labels[] = {"Off", "Medium", "High"};
      const char* light_labels[] = {"Off", "Dim", "Bright"};
      const char** labels = page == 0 ? fan_labels : light_labels;

      for (int i = 0; i < 3; i++) {
        int y = btn_start_y + i * (btn_h + btn_spacing);
        bool is_pressed = (pressed == i + 1);
        auto bg = is_pressed ? pressed_color : bg_color;
        auto border = is_pressed ? pressed_border : border_color;
        it.filled_rectangle(margin, y, btn_w, btn_h, bg);
        it.rectangle(margin, y, btn_w, btn_h, border);
        it.printf(86, y + btn_h / 2, id(roboto_large), text_color, TextAlign::CENTER, "%s", labels[i]);
      }

      int dot_y = 288;
      for (int i = 0; i < 2; i++) {
        int dot_x = 78 + i * 16;
        auto dot_color = (i == page) ? Color(255, 255, 255) : Color(60, 60, 60);
        it.filled_circle(dot_x, dot_y, 4, dot_color);
      }

      int status_y = 300;

      if (id(wifi_rssi).has_state()) {
        float rssi = id(wifi_rssi).state;
        int bars = 0;
        if (rssi > -60) bars = 4;
        else if (rssi > -70) bars = 3;
        else if (rssi > -80) bars = 2;
        else bars = 1;

        auto wifi_color = Color(0, 200, 0);
        int bar_x = 5;
        for (int i = 0; i < 4; i++) {
          int bar_h = 3 + i * 2;
          auto color = (i < bars) ? wifi_color : Color(50, 50, 50);
          it.filled_rectangle(bar_x + i * 4, status_y + 12 - bar_h, 3, bar_h, color);
        }
      } else {
        it.print(5, status_y, id(roboto_small), Color(200, 0, 0), "No WiFi");
      }

      bool api_ok = id(api_status).state == "Connected";
      auto api_color = api_ok ? Color(0, 200, 0) : Color(200, 0, 0);
      it.print(60, status_y, id(roboto_small), api_color, "ESPHome");

touchscreen:
  - platform: cst816
    id: my_touchscreen
    i2c_id: i2c_bus
    skip_probe: true
    update_interval: 50ms
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    on_touch:
      - lambda: |-
          id(swipe_start_x) = touch.y;
          id(last_touch_x) = touch.y;
          int ty = touch.x;
          int btn_idx = 0;
          if (ty >= 26 && ty <= 64) btn_idx = 1;
          else if (ty >= 69 && ty <= 107) btn_idx = 2;
          else if (ty >= 112 && ty <= 150) btn_idx = 3;
          id(pressed_btn) = btn_idx;
          ESP_LOGD("TOUCH", "Touch x=%d y=%d btn=%d page=%d", touch.x, touch.y, btn_idx, id(current_page));
    on_update:
      - lambda: 'id(last_touch_x) = touches[0].y;'
    on_release:
      - lambda: |-
          int dx = id(last_touch_x) - id(swipe_start_x);
          int btn = id(pressed_btn);
          int page = id(current_page);

          if (dx > 30) {
            id(current_page) = 0;
            id(pressed_btn) = 0;
          } else if (dx < -30) {
            id(current_page) = 1;
            id(pressed_btn) = 0;
          } else if (btn > 0) {
            ESP_LOGI("TOUCH", "Page %d Button %d activated", page, btn);
            if (page == 0) {
              if (btn == 1) id(scene_fans_off).execute();
              else if (btn == 2) id(scene_fans_medium).execute();
              else if (btn == 3) id(scene_fans_high).execute();
            } else {
              if (btn == 1) id(scene_lights_off).execute();
              else if (btn == 2) id(scene_lights_dim).execute();
              else if (btn == 3) id(scene_lights_bright).execute();
            }
            id(clear_press_feedback).execute();
            return;
          }
          id(pressed_btn) = 0;

text_sensor:
  - platform: template
    id: api_status
    name: "API Status"
    internal: true
    lambda: |-
      if (api::global_api_server != nullptr && api::global_api_server->is_connected()) {
        return {"Connected"};
      } else {
        return {"Disconnected"};
      }
    update_interval: 5s

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 30s
    internal: true
