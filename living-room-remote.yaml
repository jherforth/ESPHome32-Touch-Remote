esphome:
  name: esphome-web-ae7814
  friendly_name: Living Room Remote
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 20

spi:
  id: spi2_bus
  clk_pin: 5
  mosi_pin: 4
  miso_pin: 19

i2c:
  sda: 18
  scl: 8
  scan: true
  id: i2c_bus

globals:
  - id: touch_x
    type: int
  - id: touch_y
    type: int

display:
  - platform: st7789v
    spi_id: spi2_bus
    model: Waveshare 1.47in 172X320
    cs_pin: 7
    dc_pin: 6
    reset_pin: 14
    backlight_pin:
      number: 15
      inverted: true
    lambda: |-
      it.print(0, 0, id(roboto), "Fan 1: ");
      it.print(100, 0, id(roboto), (bool(id(fan1).state) ? "ON" : "OFF"));
      it.print(0, 20, id(roboto), "Fan 2: ");
      it.print(100, 20, id(roboto), (bool(id(fan2).state) ? "ON" : "OFF"));
      it.print(0, 40, id(roboto), "Light 1: ");
      it.print(100, 40, id(roboto), (bool(id(light1).state) ? "ON" : "OFF"));
      it.print(0, 60, id(roboto), "Light 2: ");
      it.print(100, 60, id(roboto), (bool(id(light2).state) ? "ON" : "OFF"));
      it.print(0, 80, id(roboto), "Light 3: ");
      it.print(100, 80, id(roboto), (bool(id(light3).state) ? "ON" : "OFF"));
      it.print(0, 100, id(roboto), "X: ");
      it.printf(50, 100, id(roboto), "%d", id(touch_x));
      it.print(0, 120, id(roboto), "Y: ");
      it.printf(50, 120, id(roboto), "%d", id(touch_y));

touchscreen:
  - platform: cst816
    id: my_touchscreen
    i2c_id: i2c_bus
    interrupt_pin:
      number: 22
      mode: INPUT_PULLUP
    reset_pin: 21
    skip_probe: true
    update_interval: 50ms
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    on_touch:
      - globals.set:
          id: touch_x
          value: !lambda "return touch.x;"
      - globals.set:
          id: touch_y
          value: !lambda "return touch.y;"
      - logger.log: "Touch detected!"

switch:
  - platform: gpio
    pin: 16
    name: "Fan 1"
    id: fan1
  - platform: gpio
    pin: 17
    name: "Fan 2"
    id: fan2
  - platform: gpio
    pin: 23
    name: "Light 1"
    id: light1
  - platform: gpio
    pin: 20
    name: "Light 2"
    id: light2
  - platform: gpio
    pin: 2
    name: "Light 3"
    id: light3
