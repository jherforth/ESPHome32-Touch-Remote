esphome:
  name: esphome-web-ae7814
  friendly_name: Living Room Remote
  min_version: 2025.9.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - delay: 500ms
      - lambda: |-
          auto *bus = id(i2c_bus);
          uint8_t addr = 0x15;
          uint8_t data = 0x00;
          for (int i = 0; i < 10; i++) {
            auto err = bus->write(addr, &data, 1, true);
            if (err == ESP_OK) {
              ESP_LOGI("touch", "CST816D init OK on attempt %d", i + 1);
              break;
            }
            vTaskDelay(pdMS_TO_TICKS(100));
          }

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 20
  - file: "gfonts://Roboto"
    id: roboto_large
    size: 28

spi:
  id: spi2_bus
  clk_pin: 5
  mosi_pin: 4
  miso_pin: 19

i2c:
  sda: 18
  scl: 8
  scan: true
  id: i2c_bus

display:
  - platform: st7789v
    spi_id: spi2_bus
    model: Waveshare 1.47in 172X320
    cs_pin: 7
    dc_pin: 6
    reset_pin: 14
    backlight_pin:
      number: 15
      inverted: true
    lambda: |-
      int row_h = 64;
      int text_y_offset = 18;
      auto on_color = Color(0, 200, 0);
      auto off_color = Color(200, 0, 0);
      auto divider = Color(60, 60, 60);

      for (int i = 0; i < 5; i++) {
        it.line(0, i * row_h, 170, i * row_h, divider);
      }

      auto draw_row = [&](int row, const char *label, bool state) {
        int y = row * row_h + text_y_offset;
        it.print(10, y, id(roboto_large), label);
        it.print(120, y, id(roboto_large), state ? on_color : off_color, state ? "ON" : "OFF");
      };

      draw_row(0, "Fan 1", id(fan1_state).state == "on");
      draw_row(1, "Fan 2", id(fan2_state).state == "on");
      draw_row(2, "Light1", id(light1_state).state == "on");
      draw_row(3, "Light2", id(light2_state).state == "on");
      draw_row(4, "Light3", id(light3_state).state == "on");

touchscreen:
  - platform: cst816
    id: my_touchscreen
    i2c_id: i2c_bus
    skip_probe: true
    update_interval: 50ms
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false

binary_sensor:
  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Fan 1 Touch"
    x_min: 0
    x_max: 100
    y_min: 0
    y_max: 20
    on_press:
      - homeassistant.service:
          service: fan.toggle
          data:
            entity_id: fan.0x0c2a6ffffeaa1add
  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Fan 2 Touch"
    x_min: 0
    x_max: 100
    y_min: 20
    y_max: 40
    on_press:
      - homeassistant.service:
          service: fan.toggle
          data:
            entity_id: fan.0x0c2a6ffffeaa1b91
  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Light 1 Touch"
    x_min: 0
    x_max: 100
    y_min: 40
    y_max: 60
    on_press:
      - homeassistant.service:
          service: light.toggle
          data:
            entity_id: light.0x0c2a6ffffeaa1add
  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Light 2 Touch"
    x_min: 0
    x_max: 100
    y_min: 60
    y_max: 80
    on_press:
      - homeassistant.service:
          service: light.toggle
          data:
            entity_id: light.0x0c2a6ffffeaa1b91
  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Light 3 Touch"
    x_min: 0
    x_max: 100
    y_min: 80
    y_max: 100
    on_press:
      - homeassistant.service:
          service: light.toggle
          data:
            entity_id: light.living_room_lamp

text_sensor:
  - platform: homeassistant
    id: fan1_state
    entity_id: fan.0x0c2a6ffffeaa1add
  - platform: homeassistant
    id: fan2_state
    entity_id: fan.0x0c2a6ffffeaa1b91
  - platform: homeassistant
    id: light1_state
    entity_id: light.0x0c2a6ffffeaa1add
  - platform: homeassistant
    id: light2_state
    entity_id: light.0x0c2a6ffffeaa1b91
  - platform: homeassistant
    id: light3_state
    entity_id: light.living_room_lamp
