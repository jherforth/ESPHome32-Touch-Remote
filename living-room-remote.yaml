esphome:
  name: esphome-web-remote
  friendly_name: Living Room Remote
  min_version: 2025.9.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - delay: 500ms
      - lambda: |-
          auto *bus = id(i2c_bus);
          uint8_t addr = 0x15;
          uint8_t data = 0x00;
          for (int i = 0; i < 10; i++) {
            auto err = bus->write(addr, &data, 1, true);
            if (err == ESP_OK) {
              ESP_LOGI("touch", "CST816D init OK on attempt %d", i + 1);
              break;
            }
            vTaskDelay(pdMS_TO_TICKS(100));
          }

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: target_level
    type: int
    initial_value: '0'
  - id: touch_x
    type: int
    initial_value: '0'
  - id: touch_y
    type: int
    initial_value: '0'

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 20
  - file: "gfonts://Roboto"
    id: roboto_large
    size: 28
  - file: "gfonts://Roboto"
    id: roboto_small
    size: 14

spi:
  id: spi2_bus
  clk_pin: 5
  mosi_pin: 4
  miso_pin: 19

i2c:
  sda: 18
  scl: 8
  scan: true
  id: i2c_bus

display:
  - platform: st7789v
    spi_id: spi2_bus
    model: Waveshare 1.47in 172X320
    cs_pin: 7
    dc_pin: 6
    reset_pin: 14
    rotation: 180
    backlight_pin:
      number: 15
      inverted: true
    lambda: |-
      int row_h = 58;
      int text_y_offset = 15;
      auto on_color = Color(0, 200, 0);
      auto off_color = Color(200, 0, 0);
      auto divider = Color(60, 60, 60);

      auto safe_pct = [](float val) -> int {
        if (std::isnan(val)) return 0;
        return (int)val;
      };

      auto bright_pct = [](float val) -> int {
        if (std::isnan(val)) return 0;
        return (int)(val / 255.0 * 100.0);
      };

      int levels[5] = {
        safe_pct(id(fan1_pct).state),
        safe_pct(id(fan2_pct).state),
        bright_pct(id(light1_brightness).state),
        bright_pct(id(light2_brightness).state),
        bright_pct(id(light3_brightness).state)
      };
      const char *labels[5] = {"Fan 1", "Fan 2", "Light 1", "Light 2", "Light 3"};

      for (int i = 0; i < 5; i++) {
        it.line(0, i * row_h, it.get_width(), i * row_h, divider);
        int y = i * row_h + text_y_offset;
        it.print(10, y, id(roboto_large), labels[i]);
        const char *status;
        if (levels[i] < 5) status = "Off";
        else if (levels[i] < 40) status = "Low";
        else if (levels[i] < 75) status = "Med";
        else status = "High";
        auto color = levels[i] > 0 ? on_color : off_color;
        it.print(120, y, id(roboto_large), color, status);
      }

      bool wifi_ok = id(wifi_rssi).has_state();
      auto wifi_color = wifi_ok ? Color(0, 150, 0) : Color(100, 0, 0);
      it.print(5, 296, id(roboto_small), wifi_color, wifi_ok ? "WiFi" : "No WiFi");

      bool api_ok = id(api_status).state == "Connected";
      auto api_color = api_ok ? Color(0, 150, 0) : Color(100, 100, 0);
      it.print(60, 296, id(roboto_small), api_color, id(api_status).state.c_str());

      // Touch debug display
      it.printf(120, 296, id(roboto_small), Color(255, 255, 0), "X:%d Y:%d", id(touch_x), id(touch_y));

touchscreen:
  - platform: cst816
    id: my_touchscreen
    i2c_id: i2c_bus
    skip_probe: true
    update_interval: 50ms
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    on_touch:
      - globals.set:
          id: touch_x
          value: !lambda "return touch.x;"
      - globals.set:
          id: touch_y
          value: !lambda "return touch.y;"
      - lambda: |-
          ESP_LOGW("TOUCH", "Touch detected! x=%d y=%d (raw: %d,%d)", touch.x, touch.y, touch.x_raw, touch.y_raw);

binary_sensor:
  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Fan 1 Touch"
    x_min: 0
    x_max: 172
    y_min: 0
    y_max: 58
    on_press:
      - lambda: |-
          ESP_LOGI("touch", "Fan 1 pressed!");
          float pct = id(fan1_pct).state;
          if (std::isnan(pct)) pct = 0;
          ESP_LOGI("touch", "Current pct: %.0f, setting target to:", pct);
          if (pct < 5) id(target_level) = 33;
          else if (pct < 40) id(target_level) = 66;
          else if (pct < 75) id(target_level) = 100;
          else id(target_level) = 0;
          ESP_LOGI("touch", "Target level: %d", id(target_level));
      - if:
          condition:
            lambda: 'return id(target_level) == 0;'
          then:
            - lambda: 'ESP_LOGI("touch", "Calling fan.turn_off");'
            - homeassistant.service:
                service: fan.turn_off
                data:
                  entity_id: fan.0x0c2a6ffffeaa1add
          else:
            - lambda: 'ESP_LOGI("touch", "Calling fan.set_percentage to %d", id(target_level));'
            - homeassistant.service:
                service: fan.set_percentage
                data:
                  entity_id: fan.0x0c2a6ffffeaa1add
                  percentage: !lambda 'return id(target_level);'
  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Fan 2 Touch"
    x_min: 0
    x_max: 172
    y_min: 58
    y_max: 116
    on_press:
      - lambda: |-
          float pct = id(fan2_pct).state;
          if (std::isnan(pct)) pct = 0;
          if (pct < 5) id(target_level) = 33;
          else if (pct < 40) id(target_level) = 66;
          else if (pct < 75) id(target_level) = 100;
          else id(target_level) = 0;
      - if:
          condition:
            lambda: 'return id(target_level) == 0;'
          then:
            - homeassistant.service:
                service: fan.turn_off
                data:
                  entity_id: fan.0x0c2a6ffffeaa1b91
          else:
            - homeassistant.service:
                service: fan.set_percentage
                data:
                  entity_id: fan.0x0c2a6ffffeaa1b91
                  percentage: !lambda 'return id(target_level);'
  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Light 1 Touch"
    x_min: 0
    x_max: 172
    y_min: 116
    y_max: 174
    on_press:
      - lambda: |-
          float b = id(light1_brightness).state;
          if (std::isnan(b)) b = 0;
          float pct = b / 255.0 * 100.0;
          if (pct < 5) id(target_level) = 33;
          else if (pct < 40) id(target_level) = 66;
          else if (pct < 75) id(target_level) = 100;
          else id(target_level) = 0;
      - if:
          condition:
            lambda: 'return id(target_level) == 0;'
          then:
            - homeassistant.service:
                service: light.turn_off
                data:
                  entity_id: light.0x0c2a6ffffeaa1add
          else:
            - homeassistant.service:
                service: light.turn_on
                data:
                  entity_id: light.0x0c2a6ffffeaa1add
                  brightness_pct: !lambda 'return id(target_level);'
  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Light 2 Touch"
    x_min: 0
    x_max: 172
    y_min: 174
    y_max: 232
    on_press:
      - lambda: |-
          float b = id(light2_brightness).state;
          if (std::isnan(b)) b = 0;
          float pct = b / 255.0 * 100.0;
          if (pct < 5) id(target_level) = 33;
          else if (pct < 40) id(target_level) = 66;
          else if (pct < 75) id(target_level) = 100;
          else id(target_level) = 0;
      - if:
          condition:
            lambda: 'return id(target_level) == 0;'
          then:
            - homeassistant.service:
                service: light.turn_off
                data:
                  entity_id: light.0x0c2a6ffffeaa1b91
          else:
            - homeassistant.service:
                service: light.turn_on
                data:
                  entity_id: light.0x0c2a6ffffeaa1b91
                  brightness_pct: !lambda 'return id(target_level);'
  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Light 3 Touch"
    x_min: 0
    x_max: 172
    y_min: 232
    y_max: 290
    on_press:
      - lambda: |-
          float b = id(light3_brightness).state;
          if (std::isnan(b)) b = 0;
          float pct = b / 255.0 * 100.0;
          if (pct < 5) id(target_level) = 33;
          else if (pct < 40) id(target_level) = 66;
          else if (pct < 75) id(target_level) = 100;
          else id(target_level) = 0;
      - if:
          condition:
            lambda: 'return id(target_level) == 0;'
          then:
            - homeassistant.service:
                service: light.turn_off
                data:
                  entity_id: light.living_room_lamp
          else:
            - homeassistant.service:
                service: light.turn_on
                data:
                  entity_id: light.living_room_lamp
                  brightness_pct: !lambda 'return id(target_level);'

text_sensor:
  - platform: template
    id: api_status
    name: "API Status"
    internal: true
    lambda: |-
      if (api::global_api_server != nullptr && api::global_api_server->is_connected()) {
        return {"Connected"};
      } else {
        return {"Disconnected"};
      }
    update_interval: 5s

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 30s
    internal: true
  - platform: homeassistant
    id: fan1_pct
    entity_id: fan.0x0c2a6ffffeaa1add
    attribute: percentage
    internal: true
    on_value:
      - lambda: |-
          ESP_LOGI("ha_sensor", "Fan1 pct updated: %.0f", x);
  - platform: homeassistant
    id: fan2_pct
    entity_id: fan.0x0c2a6ffffeaa1b91
    attribute: percentage
    internal: true
  - platform: homeassistant
    id: light1_brightness
    entity_id: light.0x0c2a6ffffeaa1add
    attribute: brightness
    internal: true
  - platform: homeassistant
    id: light2_brightness
    entity_id: light.0x0c2a6ffffeaa1b91
    attribute: brightness
    internal: true
  - platform: homeassistant
    id: light3_brightness
    entity_id: light.living_room_lamp
    attribute: brightness
    internal: true
