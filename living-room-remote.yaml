esphome:
  name: esphome-web-remote
  friendly_name: Living Room Remote
  min_version: 2025.9.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - delay: 500ms
      - lambda: |-
          auto *bus = id(i2c_bus);
          uint8_t addr = 0x15;
          uint8_t data = 0x00;
          for (int i = 0; i < 10; i++) {
            auto err = bus->write(addr, &data, 1, true);
            if (err == ESP_OK) {
              ESP_LOGI("touch", "CST816D init OK on attempt %d", i + 1);
              break;
            }
            vTaskDelay(pdMS_TO_TICKS(100));
          }

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  id: spi2_bus
  clk_pin: 5
  mosi_pin: 4
  miso_pin: 19

i2c:
  sda: 18
  scl: 8
  scan: true
  id: i2c_bus

script:
  - id: scene_fans_off
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_off
  - id: scene_fans_medium
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_medium
  - id: scene_fans_high
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_high
  - id: scene_lights_off
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fan_lights_off
  - id: scene_lights_dim
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.dim_fan_lights
  - id: scene_lights_bright
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.bright_fan_lights

output:
  - platform: ledc
    pin:
      number: 15
      inverted: true
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    id: my_display
    spi_id: spi2_bus
    model: ST7789V
    cs_pin: 7
    dc_pin: 6
    reset_pin: 14
    rotation: 180
    dimensions:
      width: 172
      height: 320
      offset_width: 34
      offset_height: 0
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst816
    id: my_touchscreen
    i2c_id: i2c_bus
    display: my_display
    skip_probe: true
    update_interval: 50ms
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  buffer_size: 10%
  disp_bg_color: 0x000000
  page_wrap: false
  theme:
    button:
      bg_color: 0x1E1E1E
      bg_opa: COVER
      border_color: 0x505050
      border_width: 1
      radius: 4
      text_color: 0xFFFFFF
      text_font: montserrat_28
      pressed:
        bg_color: 0x006446
        border_color: 0x00B478
  pages:
    - id: fans_page
      on_load:
        - lvgl.widget.update:
            id: dot_fans
            bg_color: 0xFFFFFF
        - lvgl.widget.update:
            id: dot_lights
            bg_color: 0x3C3C3C
      widgets:
        - obj:
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            on_swipe_left:
              - lvgl.page.show:
                  id: lights_page
                  animation: MOVE_LEFT
                  time: 200ms
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text: "FANS"
                  text_color: 0xB4B4B4
                  text_font: montserrat_28
              - obj:
                  align: TOP_MID
                  y: 48
                  width: 156
                  height: 232
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    pad_row: 8
                  widgets:
                    - button:
                        height: 72
                        id: btn_fans_off
                        on_click:
                          - script.execute: scene_fans_off
                        widgets:
                          - label:
                              align: CENTER
                              text: "Off"
                    - button:
                        height: 72
                        id: btn_fans_medium
                        on_click:
                          - script.execute: scene_fans_medium
                        widgets:
                          - label:
                              align: CENTER
                              text: "Medium"
                    - button:
                        height: 72
                        id: btn_fans_high
                        on_click:
                          - script.execute: scene_fans_high
                        widgets:
                          - label:
                              align: CENTER
                              text: "High"
    - id: lights_page
      on_load:
        - lvgl.widget.update:
            id: dot_fans
            bg_color: 0x3C3C3C
        - lvgl.widget.update:
            id: dot_lights
            bg_color: 0xFFFFFF
      widgets:
        - obj:
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            on_swipe_right:
              - lvgl.page.show:
                  id: fans_page
                  animation: MOVE_RIGHT
                  time: 200ms
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text: "LIGHTS"
                  text_color: 0xB4B4B4
                  text_font: montserrat_28
              - obj:
                  align: TOP_MID
                  y: 48
                  width: 156
                  height: 232
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    pad_row: 8
                  widgets:
                    - button:
                        height: 72
                        id: btn_lights_off
                        on_click:
                          - script.execute: scene_lights_off
                        widgets:
                          - label:
                              align: CENTER
                              text: "Off"
                    - button:
                        height: 72
                        id: btn_lights_dim
                        on_click:
                          - script.execute: scene_lights_dim
                        widgets:
                          - label:
                              align: CENTER
                              text: "Dim"
                    - button:
                        height: 72
                        id: btn_lights_bright
                        on_click:
                          - script.execute: scene_lights_bright
                        widgets:
                          - label:
                              align: CENTER
                              text: "Bright"
  top_layer:
    widgets:
      - obj:
          align: BOTTOM_MID
          y: -16
          width: 40
          height: 14
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: CENTER
            flex_align_cross: CENTER
            pad_column: 12
          widgets:
            - obj:
                id: dot_fans
                width: 10
                height: 10
                radius: 5
                border_width: 0
                pad_all: 0
                bg_opa: COVER
                bg_color: 0xFFFFFF
                on_click:
                  - lvgl.page.show:
                      id: fans_page
                      animation: MOVE_RIGHT
                      time: 200ms
            - obj:
                id: dot_lights
                width: 10
                height: 10
                radius: 5
                border_width: 0
                pad_all: 0
                bg_opa: COVER
                bg_color: 0x3C3C3C
                on_click:
                  - lvgl.page.show:
                      id: lights_page
                      animation: MOVE_LEFT
                      time: 200ms
      - label:
          id: lbl_wifi
          align: BOTTOM_LEFT
          x: 4
          y: -2
          text: "WiFi"
          text_font: montserrat_14
          text_color: 0xC80000
      - label:
          id: lbl_api
          align: BOTTOM_RIGHT
          x: -4
          y: -2
          text: "HA"
          text_font: montserrat_14
          text_color: 0xC80000

text_sensor:
  - platform: template
    id: api_status
    name: "API Status"
    internal: true
    lambda: |-
      if (api::global_api_server != nullptr && api::global_api_server->is_connected()) {
        return {"Connected"};
      } else {
        return {"Disconnected"};
      }
    update_interval: 5s
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "Connected";'
            then:
              - lvgl.label.update:
                  id: lbl_api
                  text_color: 0x00C800
            else:
              - lvgl.label.update:
                  id: lbl_api
                  text_color: 0xC80000

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 30s
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > -60;'
            then:
              - lvgl.label.update:
                  id: lbl_wifi
                  text_color: 0x00C800
            else:
              - if:
                  condition:
                    lambda: 'return x > -80;'
                  then:
                    - lvgl.label.update:
                        id: lbl_wifi
                        text_color: 0xC8C800
                  else:
                    - lvgl.label.update:
                        id: lbl_wifi
                        text_color: 0xC80000
