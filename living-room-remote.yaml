esphome:
  name: esphome-web-remote
  friendly_name: Living Room Remote
  min_version: 2025.9.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - delay: 500ms
      - lambda: |-
          auto *bus = id(i2c_bus);
          uint8_t addr = 0x15;
          uint8_t data = 0x00;
          for (int i = 0; i < 10; i++) {
            auto err = bus->write(addr, &data, 1, true);
            if (err == ESP_OK) {
              ESP_LOGI("touch", "CST816D init OK on attempt %d", i + 1);
              break;
            }
            vTaskDelay(pdMS_TO_TICKS(100));
          }

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  id: spi2_bus
  clk_pin: 5
  mosi_pin: 4
  miso_pin: 19

i2c:
  sda: 18
  scl: 8
  scan: true
  id: i2c_bus

script:
  - id: scene_fans_off
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_off
  - id: scene_fans_medium
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_medium
  - id: scene_fans_high
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_high
  - id: scene_lights_off
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fan_lights_off
  - id: scene_lights_dim
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.dim_fan_lights
  - id: scene_lights_bright
    then:
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.bright_fan_lights

output:
  - platform: ledc
    pin:
      number: 15
      inverted: true
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    id: my_display
    spi_id: spi2_bus
    model: ST7789V
    cs_pin: 7
    dc_pin: 6
    reset_pin: 14
    rotation: 180
    dimensions:
      width: 172
      height: 320
      offset_width: 34
      offset_height: 0
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: cst816
    id: my_touchscreen
    i2c_id: i2c_bus
    display: my_display
    skip_probe: true
    update_interval: 50ms
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  buffer_size: 10%
  disp_bg_color: 0x000000
  page_wrap: false
  theme:
    button:
      bg_color: 0x1E1E1E
      bg_opa: COVER
      border_color: 0x505050
      border_width: 1
      radius: 12
      text_color: 0xFFFFFF
      text_font: montserrat_28
      pressed:
        bg_color: 0x006446
        border_color: 0x00B478
  pages:
    - id: main_page
      widgets:
        - obj:
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - obj:
                  id: tab_bar
                  align: TOP_MID
                  y: 4
                  width: 164
                  height: 36
                  bg_color: 0x1E1E1E
                  bg_opa: COVER
                  border_width: 1
                  border_color: 0x505050
                  radius: 4
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    pad_column: 0
                  widgets:
                    - obj:
                        id: tab_fans
                        width: 50%
                        height: 100%
                        bg_color: 0x006446
                        bg_opa: COVER
                        border_width: 0
                        radius: 4
                        pad_all: 0
                        on_click:
                          - lvgl.widget.update:
                              id: tab_fans
                              bg_color: 0x006446
                          - lvgl.label.update:
                              id: lbl_tab_fans
                              text_color: 0xFFFFFF
                          - lvgl.widget.update:
                              id: tab_lights
                              bg_color: 0x1E1E1E
                          - lvgl.label.update:
                              id: lbl_tab_lights
                              text_color: 0x808080
                          - lvgl.widget.hide:
                              id: content_lights
                          - lvgl.widget.show:
                              id: content_fans
                        widgets:
                          - label:
                              id: lbl_tab_fans
                              align: CENTER
                              text: "Fans"
                              text_color: 0xFFFFFF
                              text_font: montserrat_18
                    - obj:
                        id: tab_lights
                        width: 50%
                        height: 100%
                        bg_color: 0x1E1E1E
                        bg_opa: COVER
                        border_width: 0
                        radius: 4
                        pad_all: 0
                        on_click:
                          - lvgl.widget.update:
                              id: tab_lights
                              bg_color: 0x006446
                          - lvgl.label.update:
                              id: lbl_tab_lights
                              text_color: 0xFFFFFF
                          - lvgl.widget.update:
                              id: tab_fans
                              bg_color: 0x1E1E1E
                          - lvgl.label.update:
                              id: lbl_tab_fans
                              text_color: 0x808080
                          - lvgl.widget.hide:
                              id: content_fans
                          - lvgl.widget.show:
                              id: content_lights
                        widgets:
                          - label:
                              id: lbl_tab_lights
                              align: CENTER
                              text: "Lights"
                              text_color: 0x808080
                              text_font: montserrat_18
              - obj:
                  id: content_fans
                  align: TOP_MID
                  y: 48
                  width: 164
                  height: 232
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    pad_row: 8
                  widgets:
                    - button:
                        width: 100%
                        height: 72
                        id: btn_fans_off
                        on_click:
                          - script.execute: scene_fans_off
                        widgets:
                          - label:
                              align: CENTER
                              text: "Off"
                    - button:
                        width: 100%
                        height: 72
                        id: btn_fans_medium
                        on_click:
                          - script.execute: scene_fans_medium
                        widgets:
                          - label:
                              align: CENTER
                              text: "Medium"
                    - button:
                        width: 100%
                        height: 72
                        id: btn_fans_high
                        on_click:
                          - script.execute: scene_fans_high
                        widgets:
                          - label:
                              align: CENTER
                              text: "High"
              - obj:
                  id: content_lights
                  align: TOP_MID
                  y: 48
                  width: 164
                  height: 232
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  hidden: true
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    pad_row: 8
                  widgets:
                    - button:
                        width: 100%
                        height: 72
                        id: btn_lights_off
                        on_click:
                          - script.execute: scene_lights_off
                        widgets:
                          - label:
                              align: CENTER
                              text: "Off"
                    - button:
                        width: 100%
                        height: 72
                        id: btn_lights_dim
                        on_click:
                          - script.execute: scene_lights_dim
                        widgets:
                          - label:
                              align: CENTER
                              text: "Dim"
                    - button:
                        width: 100%
                        height: 72
                        id: btn_lights_bright
                        on_click:
                          - script.execute: scene_lights_bright
                        widgets:
                          - label:
                              align: CENTER
                              text: "Bright"
  top_layer:
    widgets:
      - label:
          id: lbl_wifi
          align: BOTTOM_LEFT
          x: 4
          y: -2
          text: "WiFi"
          text_font: montserrat_14
          text_color: 0xC80000
      - label:
          id: lbl_api
          align: BOTTOM_RIGHT
          x: -4
          y: -2
          text: "HA"
          text_font: montserrat_14
          text_color: 0xC80000

text_sensor:
  - platform: template
    id: api_status
    name: "API Status"
    internal: true
    lambda: |-
      if (api::global_api_server != nullptr && api::global_api_server->is_connected()) {
        return {"Connected"};
      } else {
        return {"Disconnected"};
      }
    update_interval: 5s
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "Connected";'
            then:
              - lvgl.label.update:
                  id: lbl_api
                  text_color: 0x00C800
            else:
              - lvgl.label.update:
                  id: lbl_api
                  text_color: 0xC80000

binary_sensor:
  - platform: status
    id: wifi_connection_status
    internal: true
    on_press:
      - lvgl.label.update:
          id: lbl_wifi
          text_color: 0x00C800
    on_release:
      - lvgl.label.update:
          id: lbl_wifi
          text_color: 0xC80000

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 5s
    internal: true
    on_value:
      then:
        - if:
            condition:
              binary_sensor.is_on: wifi_connection_status
            then:
              - if:
                  condition:
                    lambda: 'return x > -60;'
                  then:
                    - lvgl.label.update:
                        id: lbl_wifi
                        text_color: 0x00C800
                  else:
                    - if:
                        condition:
                          lambda: 'return x > -80;'
                        then:
                          - lvgl.label.update:
                              id: lbl_wifi
                              text_color: 0xC8C800
                        else:
                          - lvgl.label.update:
                              id: lbl_wifi
                              text_color: 0xC80000
            else:
              - lvgl.label.update:
                  id: lbl_wifi
                  text_color: 0xC80000
