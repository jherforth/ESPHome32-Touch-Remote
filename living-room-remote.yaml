esphome:
  name: esphome-web-remote
  friendly_name: Living Room Remote
  min_version: 2025.9.0
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - delay: 500ms
      - lambda: |-
          auto *bus = id(i2c_bus);
          uint8_t addr = 0x15;
          uint8_t data = 0x00;
          for (int i = 0; i < 10; i++) {
            auto err = bus->write(addr, &data, 1, true);
            if (err == ESP_OK) {
              ESP_LOGI("touch", "CST816D init OK on attempt %d", i + 1);
              break;
            }
            vTaskDelay(pdMS_TO_TICKS(100));
          }

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    homeassistant.service: VERBOSE
    api: VERBOSE

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: touch_x
    type: int
    initial_value: '0'
  - id: touch_y
    type: int
    initial_value: '0'

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 20
  - file: "gfonts://Roboto"
    id: roboto_large
    size: 28
  - file: "gfonts://Roboto"
    id: roboto_small
    size: 14

spi:
  id: spi2_bus
  clk_pin: 5
  mosi_pin: 4
  miso_pin: 19

i2c:
  sda: 18
  scl: 8
  scan: true
  id: i2c_bus

display:
  - platform: st7789v
    spi_id: spi2_bus
    model: Waveshare 1.47in 172X320
    cs_pin: 7
    dc_pin: 6
    reset_pin: 14
    rotation: 180
    backlight_pin:
      number: 15
      inverted: true
    lambda: |-
      it.fill(Color(0, 0, 0));

      // Grid layout: 2 columns x 3 rows
      int margin = 8;
      int spacing = 6;
      int box_w = (172 - 2 * margin - spacing) / 2;  // 79px each
      int box_h = 85;

      auto bg_color = Color(30, 30, 30);
      auto border_color = Color(80, 80, 80);
      auto text_color = Color(255, 255, 255);

      // Helper to draw a button box with two lines of text
      auto draw_box = [&](int x, int y, const char* line1, const char* line2) {
        it.filled_rectangle(x, y, box_w, box_h, bg_color);
        it.rectangle(x, y, box_w, box_h, border_color);
        int text_x = x + box_w / 2;
        int line1_y = y + box_h / 2 - 15;
        int line2_y = y + box_h / 2 + 10;
        it.printf(text_x, line1_y, id(roboto), text_color, TextAlign::CENTER, line1);
        it.printf(text_x, line2_y, id(roboto), text_color, TextAlign::CENTER, line2);
      };

      // Column positions
      int col1_x = margin;
      int col2_x = margin + box_w + spacing;

      // Row 1: Fans Off, Fans Medium
      draw_box(col1_x, margin, "Fans", "Off");
      draw_box(col2_x, margin, "Fans", "Medium");

      // Row 2: Fans High, Lights Off
      draw_box(col1_x, margin + box_h + spacing, "Fans", "High");
      draw_box(col2_x, margin + box_h + spacing, "Lights", "Off");

      // Row 3: Dim Lights, Bright Lights
      draw_box(col1_x, margin + 2 * (box_h + spacing), "Lights", "Dim");
      draw_box(col2_x, margin + 2 * (box_h + spacing), "Lights", "Bright");

      // Status bar at bottom
      int status_y = 296;

      // WiFi signal strength bars
      if (id(wifi_rssi).has_state()) {
        float rssi = id(wifi_rssi).state;
        int bars = 0;
        if (rssi > -60) bars = 4;
        else if (rssi > -70) bars = 3;
        else if (rssi > -80) bars = 2;
        else bars = 1;

        auto wifi_color = Color(0, 200, 0);
        int bar_x = 5;
        for (int i = 0; i < 4; i++) {
          int bar_h = 3 + i * 2;
          auto color = (i < bars) ? wifi_color : Color(50, 50, 50);
          it.filled_rectangle(bar_x + i * 4, status_y + 12 - bar_h, 3, bar_h, color);
        }
      } else {
        it.print(5, status_y, id(roboto_small), Color(200, 0, 0), "No WiFi");
      }

      // ESPHome API status
      bool api_ok = id(api_status).state == "Connected";
      auto api_color = api_ok ? Color(0, 200, 0) : Color(200, 0, 0);
      it.print(60, status_y, id(roboto_small), api_color, "ESPHome");

touchscreen:
  - platform: cst816
    id: my_touchscreen
    i2c_id: i2c_bus
    skip_probe: true
    update_interval: 50ms
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    on_touch:
      - globals.set:
          id: touch_x
          value: !lambda "return touch.x;"
      - globals.set:
          id: touch_y
          value: !lambda "return touch.y;"
      - lambda: |-
          ESP_LOGW("TOUCH", "Touch detected! x=%d y=%d (raw: %d,%d)", touch.x, touch.y, touch.x_raw, touch.y_raw);

binary_sensor:
  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Fans Off"
    x_min: 8
    x_max: 87
    y_min: 8
    y_max: 93
    on_press:
      - lambda: |-
          ESP_LOGI("touch", "Fans Off pressed");
          if (api::global_api_server != nullptr && api::global_api_server->is_connected()) {
            ESP_LOGI("touch", "API connected, calling service");
          } else {
            ESP_LOGE("touch", "API not connected!");
          }
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_off

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Fans Medium"
    x_min: 93
    x_max: 172
    y_min: 8
    y_max: 93
    on_press:
      - lambda: |-
          ESP_LOGI("touch", "Fans Medium pressed");
          if (api::global_api_server != nullptr && api::global_api_server->is_connected()) {
            ESP_LOGI("touch", "API connected, calling service");
          } else {
            ESP_LOGE("touch", "API not connected!");
          }
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_medium

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Fans High"
    x_min: 8
    x_max: 87
    y_min: 99
    y_max: 184
    on_press:
      - lambda: 'ESP_LOGI("touch", "Fans High pressed");'
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fans_high

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Lights Off"
    x_min: 93
    x_max: 172
    y_min: 99
    y_max: 184
    on_press:
      - lambda: 'ESP_LOGI("touch", "Lights Off pressed");'
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.fan_lights_off

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Lights Dim"
    x_min: 8
    x_max: 87
    y_min: 190
    y_max: 275
    on_press:
      - lambda: 'ESP_LOGI("touch", "Lights Dim pressed");'
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.dim_fan_lights

  - platform: touchscreen
    touchscreen_id: my_touchscreen
    name: "Lights Bright"
    x_min: 93
    x_max: 172
    y_min: 190
    y_max: 275
    on_press:
      - lambda: 'ESP_LOGI("touch", "Lights Bright pressed");'
      - homeassistant.service:
          service: scene.turn_on
          data:
            entity_id: scene.bright_fan_lights

text_sensor:
  - platform: template
    id: api_status
    name: "API Status"
    internal: true
    lambda: |-
      if (api::global_api_server != nullptr && api::global_api_server->is_connected()) {
        return {"Connected"};
      } else {
        return {"Disconnected"};
      }
    update_interval: 5s

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 30s
    internal: true
